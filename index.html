<style>

  /* list view */

<script>
(function () {
  const KEY = 'movie-tracker:v1';
  const root = document.getElementById('root');

  let state = {
    items: [],
    seq: 1,
    view: 'gallery',
    theme: 'dark',
    tab: 'all',
    q: '',
    bump: 'all',
    status: 'all',
    ownedOnly: false,
    sort: 'manual',
    modal: null,   // {mode:'add'|'edit'|'bulk', item}
    ready: false,
    toast: ''
  };

  /* ---------- storage ---------- */
  async function load() {
    try {
      const res = await window.storage.get(KEY);
      const data = JSON.parse(res.value);
      state.items = Array.isArray(data.items) ? data.items : [];
      state.seq = data.seq || state.items.length + 1;
      state.view = data.view || 'gallery';
      state.theme = data.theme || 'dark';
    } catch (e) {
      state.items = [];
    }
    state.ready = true;
    render();
  }

  let saveTimer = null;
  function save() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(async () => {
      try {
        await window.storage.set(KEY, JSON.stringify({
          items: state.items, seq: state.seq, view: state.view, theme: state.theme
        }));
      } catch (e) {
        toast('Changes could not be saved. Export a backup to be safe.');
      }
    }, 250);
  }

  function toast(msg) {
    state.toast = msg;
    render();
    setTimeout(() => { state.toast = ''; render(); }, 2200);
  }

  /* ---------- helpers ---------- */
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  function lists() {
    const seen = [];
    state.items.forEach(i => { if (i.list && !seen.includes(i.list)) seen.push(i.list); });
    return seen.sort();
  }

  function visible() {
    let out = state.items.slice();
    if (state.tab !== 'all') out = out.filter(i => i.list === state.tab);
    if (state.status === 'watched') out = out.filter(i => i.watched);
    if (state.status === 'unwatched') out = out.filter(i => !i.watched);
    if (state.ownedOnly) out = out.filter(i => i.own);
    const q = state.q.trim().toLowerCase();
    if (q) out = out.filter(i =>
      (i.title + ' ' + (i.year || '') + ' ' + (i.notes || '') + ' ' + (i.tag || '')).toLowerCase().includes(q));

    const by = {
      manual: (a, b) => a.order - b.order,
      title: (a, b) => a.title.localeCompare(b.title),
      year: (a, b) => (Number(b.year) || 0) - (Number(a.year) || 0),
      rating: (a, b) => (b.rating || 0) - (a.rating || 0),
      added: (a, b) => b.id - a.id
    };
    const within = by[state.sort] || by.manual;

    if (state.bump === 'all') return out.sort(within);
    const rank = i => (i.priority === state.bump ? 0 : 1);
    return out.sort((a, b) => rank(a) - rank(b) || within(a, b));
  }

  function stats() {
    const pool = state.tab === 'all' ? state.items : state.items.filter(i => i.list === state.tab);
    return {
      total: pool.length,
      owned: pool.filter(i => i.own).length,
      important: pool.filter(i => i.priority === 'important').length,
      watched: pool.filter(i => i.watched).length
    };
  }

  /* ---------- mutations ---------- */
  function addItem(v) {
    state.items.push({
      id: state.seq++,
      order: state.items.length,
      title: v.title,
      year: v.year || '',
      list: v.list || 'Watchlist',
      priority: v.priority || 'standard',
      tag: v.tag || '',
      notes: v.notes || '',
      rating: v.rating || 0,
      watched: !!v.watched,
      own: v.own || ''
    });
  }

  function move(id, dir) {
    const i = state.items.findIndex(x => x.id === id);
    const j = i + dir;
    if (i < 0 || j < 0 || j >= state.items.length) return;
    const t = state.items[i]; state.items[i] = state.items[j]; state.items[j] = t;
    state.items.forEach((x, k) => x.order = k);
    save(); render();
  }

  /* ---------- render ---------- */
  function render() {
    if (!state.ready) return;
    const s = stats();
    const items = visible();
    const filtered = !!(state.q.trim() || state.tab !== 'all' || state.status !== 'all' || state.ownedOnly || state.bump !== 'all');
    const tabs = lists();

    root.className = state.theme === 'light' ? 'light' : '';
    root.innerHTML = `
      <div class="topbar">
        <div class="mark">🎬</div>
        <div class="title-block">
          <div class="apptitle">
            Movie Tracker
            <div class="tabs">
              <span class="tabslabel">Lists</span>
              <button class="tab ${state.tab === 'all' ? 'on' : ''}" data-tab="all">All (${state.items.length})</button>
              ${tabs.map(l => `<button class="tab ${state.tab === l ? 'on' : ''}" data-tab="${esc(l)}">${esc(l)} (${state.items.filter(i => i.list === l).length})</button>`).join('')}
            </div>
          </div>
          <div class="subtitle">Green edge means you've watched it. Star it after.</div>
        </div>
        <div class="head-actions">
          <div class="seg">
            <button class="${state.view === 'gallery' ? 'on' : ''}" data-view="gallery">Gallery</button>
            <button class="${state.view === 'list' ? 'on' : ''}" data-view="list">List</button>
          </div>
          <button class="btn-quiet icobtn" data-act="theme" title="${state.theme === 'dark' ? 'Switch to light' : 'Switch to dark'}" aria-label="Switch theme">
            ${state.theme === 'dark'
              ? `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2.4M12 19.6V22M2 12h2.4M19.6 12H22M4.9 4.9l1.7 1.7M17.4 17.4l1.7 1.7M19.1 4.9l-1.7 1.7M6.6 17.4l-1.7 1.7"/></svg>`
              : `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z"/></svg>`}
          </button>
          <button class="btn-quiet" data-act="bulk">Paste list</button>
          <button class="btn-quiet" data-act="backup">Backup</button>
          <button class="btn-primary" data-act="add">+ Add title</button>
        </div>
      </div>

      <div class="stats">
        ${filtered
          ? `<button class="stat reset" data-tile="reset" title="Clear search and filters">
               <span>Showing <em>· reset</em></span><b>${items.length} of ${state.items.length}</b>
             </button>`
          : `<div class="stat"><span>Total titles</span><b>${state.items.length}</b></div>`}
        <button class="stat owned ${state.ownedOnly ? 'active' : ''}" data-tile="owned">
          <span>You own</span><b>${s.owned}</b>
        </button>
        <button class="stat important ${state.bump === 'important' ? 'active' : ''}" data-tile="important">
          <span>Important</span><b>${s.important}</b>
        </button>
        <button class="stat watched ${state.status === 'watched' ? 'active' : ''}" data-tile="watched">
          <div class="statline"><span>Watched</span><b>${s.watched} / ${s.total}</b></div>
          <div class="bar"><i style="width:${s.total ? Math.round(s.watched / s.total * 100) : 0}%"></i></div>
        </button>
      </div>

      <div class="wrap">
        <div class="filters">
          <div class="search">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            <input id="q" type="search" placeholder="Search title, year, or notes…" value="${esc(state.q)}">
          </div>
          <div class="fgroup">
            <span class="flabel">Order</span>
            <button class="chip ${state.bump === 'all' ? 'on' : ''}" data-bump="all">All</button>
            <button class="chip ${state.bump === 'important' ? 'on' : ''}" data-bump="important">↑ Important (${state.items.filter(i => i.priority === 'important').length})</button>
            <button class="chip ${state.bump === 'standard' ? 'on' : ''}" data-bump="standard">↑ Standard (${state.items.filter(i => i.priority === 'standard').length})</button>
          </div>
          <div class="fgroup">
            <span class="flabel">Status</span>
            <button class="chip ${state.status === 'all' ? 'on' : ''}" data-status="all">All</button>
            <button class="chip ${state.status === 'unwatched' ? 'on' : ''}" data-status="unwatched">Unwatched</button>
            <button class="chip ${state.status === 'watched' ? 'on' : ''}" data-status="watched">Watched</button>
            <button class="chip owned ${state.ownedOnly ? 'on' : ''}" data-ownedonly="1">Owned only</button>
          </div>
          <select id="sort" style="margin-left:auto">
            <option value="manual" ${state.sort === 'manual' ? 'selected' : ''}>Your order</option>
            <option value="added" ${state.sort === 'added' ? 'selected' : ''}>Recently added</option>
            <option value="title" ${state.sort === 'title' ? 'selected' : ''}>Title A–Z</option>
            <option value="year" ${state.sort === 'year' ? 'selected' : ''}>Newest year</option>
            <option value="rating" ${state.sort === 'rating' ? 'selected' : ''}>Highest rated</option>
          </select>
        </div>

        ${items.length ? `<div class="grid ${state.view === 'list' ? 'list' : ''}">${cards(items)}</div>` : emptyState()}
      </div>

      ${state.modal ? modal() : ''}
      ${state.toast ? `<div class="toast">${esc(state.toast)}</div>` : ''}
    `;
    wire();
  }

  function cards(items) {
    if (state.bump === 'all') return items.map(card).join('');
    const other = state.bump === 'important' ? 'standard' : 'important';
    const label = other === 'important' ? 'Important' : 'Standard';
    let html = '', crossed = false;
    items.forEach(i => {
      if (!crossed && i.priority === other) {
        crossed = true;
        html += `<div class="divider"><span>${label}</span></div>`;
      }
      html += card(i);
    });
    return html;
  }

  function emptyState() {
    const filtered = state.items.length > 0;
    return `<div class="empty-state">
      <h2>${filtered ? 'Nothing matches those filters' : 'Your list is empty'}</h2>
      <p>${filtered
        ? 'Clear the search or switch the filters back to All to see everything again.'
        : 'Add titles one at a time, or paste a list you already keep in a spreadsheet.'}</p>
      <div class="empty-actions">
        ${filtered
          ? `<button class="btn-primary" data-act="clearfilters">Clear filters</button>`
          : `<button class="btn-primary" data-act="add">+ Add title</button>
             <button class="btn-quiet" data-act="bulk">Paste a list</button>`}
      </div>
    </div>`;
  }

  function card(i) {
    return `<div class="card ${i.watched ? 'done' : ''} ${i.priority === 'important' ? 'important' : ''}" data-id="${i.id}">
      <div class="card-head">
        <div class="badges">
          <span class="b list">${esc(i.list || 'Watchlist')}</span>
          ${i.year ? `<span class="b year">${esc(i.year)}</span>` : `<span class="b">Year TBD</span>`}
          ${i.priority === 'important' ? `<span class="sr">Important</span>` : ''}
        </div>
        <div class="card-title ${i.watched ? 'done' : ''}">${esc(i.title)}</div>
      </div>
      <div class="card-body">
        ${i.tag ? `<div class="tagline">🏷 ${esc(i.tag)}</div>` : ''}
        <div class="notes ${i.notes ? '' : 'empty'}">${i.notes ? esc(i.notes) : 'No notes added'}</div>
        <div class="ratingrow">
          <span>${i.watched && !i.rating ? 'Rate it' : 'Rating'}</span>
          <div class="stars">
            ${[1, 2, 3, 4, 5].map(n => `<button class="${i.rating >= n ? 'lit' : ''}" data-star="${n}" aria-label="Rate ${n} of 5">★</button>`).join('')}
          </div>
          <span class="rnum">${i.rating ? i.rating : '—'}</span>
        </div>
      </div>
      <div class="cardfoot">
        <button class="watchbtn ${i.watched ? 'on' : ''}" data-toggle="1"
          title="${i.watched ? 'Move back to unwatched' : 'Mark this as watched'}">
          <span class="box">✓</span>${i.watched ? 'Watched' : 'Mark watched'}
        </button>
        <button class="ownbtn ${i.own ? 'on' : ''}" data-own="1"
          title="${i.own ? 'You own this on ' + esc(i.own) + '. Click to remove.' : 'Mark as owned'}">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2.6"/></svg>
          ${i.own ? esc(i.own) : ''}
        </button>
        ${i.watched && i.watchedAt ? `<span class="wdate">${esc(i.watchedAt)}</span>` : ''}
        <div class="icons">
          ${state.sort === 'manual' ? `
          <button data-move="-1" title="Move up" aria-label="Move up">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
          </button>
          <button data-move="1" title="Move down" aria-label="Move down">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M19 12l-7 7-7-7"/></svg>
          </button>` : ''}
          <button data-edit="1" title="Edit" aria-label="Edit">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
          </button>
          <button class="del" data-del="1" title="Delete" aria-label="Delete">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg>
          </button>
        </div>
      </div>
    </div>`;
  }

  function modal() {
    const m = state.modal;
    if (m.mode === 'backup') {
      const p = m.pending;
      return `<div class="scrim" data-scrim="1"><div class="modal">
        <div class="modal-head"><h2>Backup and restore</h2><button data-close="1" aria-label="Close">✕</button></div>
        <div class="modal-body">
          <div class="panel">
            <h3>Save a copy</h3>
            <p class="hint">Downloads all ${state.items.length} titles as a JSON file — ratings, notes, watched dates and ownership included.</p>
            <button class="btn-quiet" data-act2="export">Download JSON</button>
          </div>
          <div class="panel">
            <h3>Restore from a file</h3>
            ${p
              ? `<p class="hint">Read <b>${esc(p.name)}</b> — found ${p.items.length} titles${p.skipped ? ', ignored ' + p.skipped + ' unreadable rows' : ''}.</p>
                 <div class="choice">
                   <button class="btn-quiet" data-import="merge">Add to my list</button>
                   <button class="btn-danger" data-import="replace">Replace everything</button>
                 </div>
                 <p class="hint">Adding skips anything with a matching title and year. Replacing wipes your current ${state.items.length} titles first.</p>`
              : `<p class="hint">Pick a JSON file exported from this tracker. Nothing changes until you choose what to do with it.</p>
                 <label class="filebox">
                   <input type="file" id="importfile" accept="application/json,.json">
                   <span>Choose a file</span>
                 </label>`}
          </div>
        </div>
        <div class="modal-foot"><button class="btn-quiet" data-close="1">Done</button></div>
      </div></div>`;
    }

    if (m.mode === 'bulk') {
      return `<div class="scrim" data-scrim="1"><div class="modal">
        <div class="modal-head"><h2>Paste a list</h2><button data-close="1" aria-label="Close">✕</button></div>
        <div class="modal-body">
          <div class="field">
            <label for="bulktext">One title per line</label>
            <textarea id="bulktext" style="min-height:150px" placeholder="Coyotes
Rabbit Trap | 2026
Ash | 2025 | important"></textarea>
            <div class="hint">Optional extras after a pipe: year, then the word "important".</div>
          </div>
          <div class="field">
            <label for="bulklist">Add them to</label>
            <input id="bulklist" value="${esc(state.tab === 'all' ? 'Watchlist' : state.tab)}">
          </div>
        </div>
        <div class="modal-foot">
          <button class="btn-quiet" data-close="1">Cancel</button>
          <button class="btn-primary" data-save="bulk">Add titles</button>
        </div>
      </div></div>`;
    }

    const i = m.item || { title: '', year: '', list: state.tab === 'all' ? 'Watchlist' : state.tab, priority: 'standard', tag: '', notes: '', rating: 0, watched: false, own: '' };
    const known = lists();
    return `<div class="scrim" data-scrim="1"><div class="modal">
      <div class="modal-head"><h2>${m.mode === 'edit' ? 'Edit title' : 'Add title'}</h2><button data-close="1" aria-label="Close">✕</button></div>
      <div class="modal-body">
        <div class="field">
          <label for="f-title">Title</label>
          <input id="f-title" value="${esc(i.title)}" placeholder="The Rule of Jenny Pen">
        </div>
        <div class="row2">
          <div class="field">
            <label for="f-year">Year</label>
            <input id="f-year" value="${esc(i.year)}" placeholder="Leave blank if unknown">
          </div>
          <div class="field">
            <label for="f-list">List</label>
            <input id="f-list" value="${esc(i.list)}" list="known-lists">
            <datalist id="known-lists">${known.map(l => `<option value="${esc(l)}">`).join('')}</datalist>
          </div>
        </div>
        <div class="row2">
          <div class="field">
            <label for="f-prio">Priority</label>
            <select id="f-prio">
              <option value="standard" ${i.priority === 'standard' ? 'selected' : ''}>Standard</option>
              <option value="important" ${i.priority === 'important' ? 'selected' : ''}>Important</option>
            </select>
          </div>
          <div class="field">
            <label for="f-tag">Tag</label>
            <input id="f-tag" value="${esc(i.tag)}" placeholder="Where to watch, who recommended it…">
          </div>
        </div>
        <div class="field">
          <label for="f-notes">Notes</label>
          <textarea id="f-notes" placeholder="Anything you want to remember">${esc(i.notes)}</textarea>
        </div>
        <div class="row3">
          <div class="field">
            <label for="f-rating">Rating</label>
            <select id="f-rating">
              ${[0, 1, 2, 3, 4, 5].map(n => `<option value="${n}" ${i.rating === n ? 'selected' : ''}>${n === 0 ? 'Not rated' : n + ' ★'}</option>`).join('')}
            </select>
          </div>
          <div class="field">
            <label for="f-watched">Status</label>
            <select id="f-watched">
              <option value="0" ${!i.watched ? 'selected' : ''}>Unwatched</option>
              <option value="1" ${i.watched ? 'selected' : ''}>Watched</option>
            </select>
          </div>
          <div class="field">
            <label for="f-own">You own it on</label>
            <select id="f-own">
              ${['', 'Owned', 'Digital', 'Blu-ray', '4K UHD', 'DVD'].map(o =>
                `<option value="${o}" ${(i.own || '') === o ? 'selected' : ''}>${o === '' ? "Don't own it" : o}</option>`).join('')}
            </select>
          </div>
        </div>
      </div>
      <div class="modal-foot">
        <button class="btn-quiet" data-close="1">Cancel</button>
        <button class="btn-primary" data-save="one">${m.mode === 'edit' ? 'Save changes' : 'Add title'}</button>
      </div>
    </div></div>`;
  }

  /* ---------- events ---------- */
  function wire() {
    const q = document.getElementById('q');
    if (q) {
      q.oninput = e => { state.q = e.target.value; render(); document.getElementById('q').focus(); };
      if (state.q) { q.focus(); q.setSelectionRange(q.value.length, q.value.length); }
    }
    const sort = document.getElementById('sort');
    if (sort) sort.onchange = e => { state.sort = e.target.value; render(); };

    root.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { state.tab = b.dataset.tab; render(); });
    root.querySelectorAll('[data-view]').forEach(b => b.onclick = () => { state.view = b.dataset.view; save(); render(); });
    root.querySelectorAll('[data-bump]').forEach(b => b.onclick = () => { state.bump = b.dataset.bump; render(); });
    root.querySelectorAll('[data-tile]').forEach(b => b.onclick = () => {
      const t = b.dataset.tile;
      if (t === 'important') state.bump = state.bump === 'important' ? 'all' : 'important';
      if (t === 'watched') state.status = state.status === 'watched' ? 'all' : 'watched';
      if (t === 'owned') state.ownedOnly = !state.ownedOnly;
      if (t === 'reset') {
        state.q = ''; state.tab = 'all'; state.bump = 'all';
        state.status = 'all'; state.ownedOnly = false;
      }
      render();
    });
    const oo = root.querySelector('[data-ownedonly]');
    if (oo) oo.onclick = () => { state.ownedOnly = !state.ownedOnly; render(); };
    root.querySelectorAll('[data-status]').forEach(b => b.onclick = () => { state.status = b.dataset.status; render(); });

    root.querySelectorAll('[data-act]').forEach(b => b.onclick = () => {
      const a = b.dataset.act;
      if (a === 'add') state.modal = { mode: 'add' };
      if (a === 'theme') { state.theme = state.theme === 'dark' ? 'light' : 'dark'; save(); }
      if (a === 'bulk') state.modal = { mode: 'bulk' };
      if (a === 'clearfilters') { state.q = ''; state.bump = 'all'; state.status = 'all'; state.tab = 'all'; state.ownedOnly = false; }
      if (a === 'backup') state.modal = { mode: 'backup', pending: null };
      render();
    });

    root.querySelectorAll('.card').forEach(el => {
      const id = Number(el.dataset.id);
      const item = state.items.find(x => x.id === id);
      el.querySelectorAll('[data-star]').forEach(b => b.onclick = () => {
        const n = Number(b.dataset.star);
        item.rating = item.rating === n ? 0 : n;
        save(); render();
      });
      el.querySelector('[data-toggle]').onclick = () => {
        item.watched = !item.watched;
        item.watchedAt = item.watched
          ? new Date().toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' })
          : '';
        save(); render();
      };
      el.querySelector('[data-own]').onclick = () => {
        item.own = item.own ? '' : 'Owned';
        save(); render();
      };
      el.querySelectorAll('[data-move]').forEach(b => b.onclick = () => move(id, Number(b.dataset.move)));
      el.querySelector('[data-edit]').onclick = () => { state.modal = { mode: 'edit', item }; render(); };
      el.querySelector('[data-del]').onclick = () => {
        if (!confirm('Delete "' + item.title + '"?')) return;
        state.items = state.items.filter(x => x.id !== id);
        state.items.forEach((x, k) => x.order = k);
        save(); render();
      };
    });

    root.querySelectorAll('[data-close], [data-scrim]').forEach(el => el.onclick = e => {
      if (el.dataset.scrim && e.target !== el) return;
      state.modal = null; render();
    });

    const fileInput = root.querySelector('#importfile');
    if (fileInput) fileInput.onchange = e => { if (e.target.files[0]) readFile(e.target.files[0]); };
    root.querySelectorAll('[data-import]').forEach(b => b.onclick = () => commitImport(b.dataset.import));
    const exp = root.querySelector('[data-act2="export"]');
    if (exp) exp.onclick = exportJson;

    const saveBtn = root.querySelector('[data-save]');
    if (saveBtn) saveBtn.onclick = () => saveBtn.dataset.save === 'bulk' ? commitBulk() : commitOne();

    const first = root.querySelector('#f-title, #bulktext');
    if (first) first.focus();
  }

  function commitOne() {
    const title = document.getElementById('f-title').value.trim();
    if (!title) { document.getElementById('f-title').focus(); return toast('Give it a title first.'); }
    const v = {
      title,
      year: document.getElementById('f-year').value.trim(),
      list: document.getElementById('f-list').value.trim() || 'Watchlist',
      priority: document.getElementById('f-prio').value,
      tag: document.getElementById('f-tag').value.trim(),
      notes: document.getElementById('f-notes').value.trim(),
      rating: Number(document.getElementById('f-rating').value),
      watched: document.getElementById('f-watched').value === '1',
      own: document.getElementById('f-own').value
    };
    const today = new Date().toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
    if (state.modal.mode === 'edit') {
      const was = state.modal.item.watched;
      Object.assign(state.modal.item, v);
      if (v.watched && !was) state.modal.item.watchedAt = today;
      if (!v.watched) state.modal.item.watchedAt = '';
    }
    else addItem(v);
    state.modal = null; save(); render();
  }

  function commitBulk() {
    const list = document.getElementById('bulklist').value.trim() || 'Watchlist';
    const lines = document.getElementById('bulktext').value.split('\n').map(l => l.trim()).filter(Boolean);
    if (!lines.length) return toast('Paste at least one title.');
    lines.forEach(line => {
      const [title, year, flag] = line.split('|').map(p => (p || '').trim());
      if (!title) return;
      addItem({
        title,
        year: /^\d{4}$/.test(year || '') ? year : '',
        list,
        priority: /important/i.test(flag || '') ? 'important' : 'standard'
      });
    });
    state.modal = null; save(); render();
    toast(lines.length + ' titles added.');
  }

  function exportJson() {
    const payload = {
      app: 'movie-tracker',
      version: 1,
      exportedAt: new Date().toISOString(),
      count: state.items.length,
      items: state.items
    };
    const stamp = new Date().toISOString().slice(0, 10);
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `movie-tracker-${stamp}.json`;
    a.click();
    URL.revokeObjectURL(a.href);
    toast('Backup downloaded.');
  }

  function normalizeImported(o) {
    if (!o || typeof o.title !== 'string' || !o.title.trim()) return null;
    const own = String(o.own || '').trim();
    return {
      title: o.title.trim(),
      year: /^\d{4}$/.test(String(o.year || '')) ? String(o.year) : '',
      list: (o.list && String(o.list).trim()) || 'Watchlist',
      priority: o.priority === 'important' ? 'important' : 'standard',
      tag: String(o.tag || '').trim(),
      notes: String(o.notes || '').trim(),
      rating: Math.max(0, Math.min(5, Math.round(Number(o.rating) || 0))),
      watched: !!o.watched,
      watchedAt: String(o.watchedAt || '').trim(),
      own: own
    };
  }

  function readFile(file) {
    const reader = new FileReader();
    reader.onload = () => {
      let parsed;
      try { parsed = JSON.parse(reader.result); }
      catch (e) { return toast("That file isn't valid JSON."); }
      const raw = Array.isArray(parsed) ? parsed : parsed.items;
      if (!Array.isArray(raw)) return toast('No titles found in that file.');
      const items = raw.map(normalizeImported).filter(Boolean);
      if (!items.length) return toast('No usable titles in that file.');
      state.modal = { mode: 'backup', pending: { items, name: file.name, skipped: raw.length - items.length } };
      render();
    };
    reader.onerror = () => toast("That file couldn't be read.");
    reader.readAsText(file);
  }

  function key(i) { return (i.title + '|' + (i.year || '')).toLowerCase(); }

  function commitImport(mode) {
    const incoming = state.modal.pending.items;
    if (mode === 'replace') {
      if (!confirm('Replace all ' + state.items.length + ' titles with the ' + incoming.length + ' in this file? This cannot be undone.')) return;
      state.items = [];
      state.seq = 1;
    }
    const existing = new Set(state.items.map(key));
    let added = 0, dupes = 0;
    incoming.forEach(i => {
      if (existing.has(key(i))) { dupes++; return; }
      existing.add(key(i));
      addItem(i);
      const justAdded = state.items[state.items.length - 1];
      justAdded.watchedAt = i.watchedAt;
      added++;
    });
    state.items.forEach((x, k) => x.order = k);
    state.modal = null;
    save(); render();
    toast(added + ' added' + (dupes ? ', ' + dupes + ' skipped as duplicates' : '') + '.');
  }

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && state.modal) { state.modal = null; render(); }
  });

  load();
})();
</script>
